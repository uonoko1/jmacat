name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported baseline; 3.12 guards against relying on
        # anything newer. The guard reads sys.stdlib_module_names, which
        # differs between versions, so it must pass on both.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        # -m "" clears the default "not slow" deselection, so CI runs the
        # full-scale writer tests (257,020 records) that a local red-green
        # cycle skips. See tests/infrastructure/test_full_scale.py.
        run: uv run pytest -m ""

[project]
name = "jmacat"
version = "0.1.0"
description = "Preprocessing tool for the JMA seismic catalog (research and education use)"
requires-python = ">=3.11"
# Runtime dependencies are added by the layer that needs them. `domain/` and
# `usecase/` must stay standard-library only; see CONTRIBUTING.md.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jmacat"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib import mode lets two layers hold a same-named test file
# (tests/domain/test_record.py and tests/infrastructure/test_record.py)
# without tests/ becoming packages. Under the default prepend mode the
# basename collision aborts collection for the whole suite.
addopts = "--strict-markers --strict-config --import-mode=importlib"
# --strict-markers means an unregistered marker is an error, so the one
# network-touching test's marker is declared here. It is skipped unless
# JMACAT_INTEGRATION is set; `-m "not integration"` deselects it outright.
markers = [
    "integration: touches the live JMA site; opt in with JMACAT_INTEGRATION=1",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint.isort]
# `src = ["src", "tests"]` makes `tests/` a source root, so isort resolves the
# name `tests` by looking for `tests/tests/` - finds nothing, and files
# `from tests.fakes import ...` under third-party. Naming it explicitly keeps
# the shared test doubles in the first-party block with `jmacat`.
known-first-party = ["tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
# `tests/` holds no `__init__.py`, so two layers' same-named test modules would
# otherwise collide as one "test_record" (the mypy twin of the pytest collection
# error that --import-mode=importlib fixes). Deriving module names from these
# roots keeps them distinct without making tests/ a package.
mypy_path = ["src", "."]
explicit_package_bases = true
